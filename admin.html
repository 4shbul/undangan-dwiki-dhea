<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Generate Link Undangan - Rangga & Nanda</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 10px;
      color: #c9a96b;
    }

    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 35px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 1px;
      color: #b0b0b0;
      margin-bottom: 8px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #2a2a2a;
      color: #e0e0e0;
      font-family: "Inter", sans-serif;
      font-size: 13px;
      resize: vertical;
      outline: none;
      transition: 0.3s;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #c9a96b;
      box-shadow: 0 0 0 3px rgba(201, 169, 107, 0.15);
    }

    textarea::placeholder,
    input::placeholder {
      color: #666;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: 0;
      border-radius: 30px;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      font-family: "Inter", sans-serif;
    }

    .btn-primary {
      background: #c9a96b;
      color: #1a1a1a;
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(201, 169, 107, 0.3);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #c9a96b;
      color: #c9a96b;
      margin-top: 10px;
      width: 100%;
    }

    .btn-outline:hover {
      background: #c9a96b;
      color: #1a1a1a;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #222;
      border: 1px solid #444;
      border-radius: 12px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-label {
      font-size: 10px;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 10px;
    }

    .result-link {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .result-link input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 12px;
      font-family: "Inter", sans-serif;
      outline: none;
    }

    .result-link button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #c9a96b;
      color: #1a1a1a;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .result-text {
      padding: 14px;
      background: #1a1a1a;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.7;
      color: #c0c0c0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .copy-status {
      font-size: 10px;
      color: #c9a96b;
      margin-top: 8px;
      min-height: 16px;
    }

    .divider {
      height: 1px;
      background: #333;
      margin: 25px 0;
    }

    .batch-section {
      margin-top: 10px;
    }

    .batch-section p {
      font-size: 11px;
      color: #888;
      margin-bottom: 10px;
    }

    .batch-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .batch-item {
      padding: 14px;
      background: #222;
      border: 1px solid #333;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .batch-item-name {
      font-weight: 500;
      color: #c9a96b;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .batch-item-link {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .batch-item-link input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 11px;
      font-family: "Inter", sans-serif;
      outline: none;
    }

    .batch-item-link button,
    .batch-item button {
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: #c9a96b;
      color: #1a1a1a;
      font-size: 10px;
      cursor: pointer;
    }

    .batch-item-text {
      padding: 10px;
      background: #1a1a1a;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.6;
      color: #b0b0b0;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
    }

    .batch-item-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .batch-item-status {
      font-size: 9px;
      color: #c9a96b;
      min-height: 14px;
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Generate Link Undangan</h1>

    <p class="subtitle">
      Rangga & Nanda — 19 September 2026
    </p>


    <!-- SINGLE INPUT -->

    <div class="form-group">

      <label>NAMA TAMU</label>

      <input
        type="text"
        id="guestName"
        placeholder="Contoh: Bapak Andi"
      >

    </div>

    <button class="btn btn-primary" onclick="generateSingle()">
      GENERATE LINK
    </button>

    <div class="result" id="singleResult">

      <div class="result-label">LINK UNDANGAN</div>

      <div class="result-link">
        <input type="text" id="singleLink" readonly>
        <button onclick="copySingleLink()">Salin</button>
      </div>

      <div class="result-label">TEKS WHATSAPP</div>

      <div class="result-text" id="singleText"></div>

      <button class="btn btn-outline" onclick="copySingleText()">
        Salin Teks WhatsApp
      </button>

      <div class="copy-status" id="singleStatus"></div>

    </div>


    <div class="divider"></div>


    <!-- BATCH INPUT -->

    <div class="batch-section">

      <label>BATCH - NAMA TAMU (1 per baris)</label>

      <textarea
        id="batchNames"
        rows="6"
        placeholder="Bapak Andi&#10;Ibu Sari&#10;Keluarga Pak Budi&#10;Teman Kantor"
      ></textarea>

      <button class="btn btn-primary" style="margin-top: 12px;" onclick="generateBatch()">
        GENERATE SEMUA
      </button>

      <div class="batch-list" id="batchList"></div>

    </div>

  </div>


  <script>

    const baseUrl =
      window.location.origin +
      window.location.pathname.replace(
        /admin\.html$/,
        "index.html"
      );


    function generateLink(name) {

      const encoded =
        encodeURIComponent(name);

      return baseUrl + "?to=" + encoded;

    }


    function generateText(name, link) {

      return `Assalamu'alaikum Warahmatullahi Wabarakatuh

Kepada Yth. ${name}

Dengan memohon Rahmat dan Ridho Allah SWT yang telah menciptakan makhluknya berpasang-pasangan. Kami mohon doa restu untuk menikahkan putra-putri kami:

*Dwiki Rangga, S.Pd., Gr*
Putra kedua dari Bapak Puang Samula dan Ibu Puang Sumarni

*&*

*Dhea Ananda, S.Kom*
Putri tunggal dari Bapak Puang Syamsir dan Ibu Puang Sakaria

Sabtu, 19 September 2026
Pukul 09.00 WITA
Dusun Bonto Marahe, Desa Possi Tanah,
Kecamatan Kajang, Kabupaten Bulukumba
(Dekat Sekolah MTS Guppi Possi Tanah)

Berikut link undangan digital kami:
${link}

Atas kehadiran dan do'a restu Bapak/Ibu/Saudara/i, kami ucapkan terima kasih.

Wassalamu'alaikum Warahmatullahi Wabarakatuh

Hormat kami,
Puang Samula (Pula) & Puang Sumarni (Suma)
Rangga & Nanda`;

    }


    /* SINGLE GENERATE */

    function generateSingle() {

      const name =
        document.getElementById(
          "guestName"
        ).value.trim();

      if (!name) {

        alert("Masukkan nama tamu.");

        return;

      }

      const link = generateLink(name);

      const text =
        generateText(name, link);

      document.getElementById(
        "singleLink"
      ).value = link;

      document.getElementById(
        "singleText"
      ).textContent = text;

      document.getElementById(
        "singleResult"
      ).classList.add("show");

      document.getElementById(
        "singleStatus"
      ).textContent = "";

    }


    function copySingleLink() {

      const input =
        document.getElementById(
          "singleLink"
        );

      input.select();

      navigator.clipboard.writeText(
        input.value
      );

      document.getElementById(
        "singleStatus"
      ).textContent =
        "Link berhasil disalin!";

    }


    function copySingleText() {

      const text =
        document.getElementById(
          "singleText"
        ).textContent;

      navigator.clipboard.writeText(
        text
      );

      document.getElementById(
        "singleStatus"
      ).textContent =
        "Teks berhasil disalin!";

    }


    /* BATCH GENERATE */

    function generateBatch() {

      const raw =
        document.getElementById(
          "batchNames"
        ).value;

      const names =
        raw.split("\n")
          .map(function(n) {
            return n.trim();
          })
          .filter(function(n) {
            return n.length > 0;
          });

      if (names.length === 0) {

        alert(
          "Masukkan minimal 1 nama tamu."
        );

        return;

      }

      const list =
        document.getElementById(
          "batchList"
        );

      list.innerHTML = "";

      names.forEach(function(
        name,
        index
      ) {

        const link =
          generateLink(name);

        const text =
          generateText(name, link);

        const item =
          document.createElement("div");

        item.className = "batch-item";

        item.innerHTML = `

          <div class="batch-item-name">
            ${index + 1}. ${name}
          </div>

          <div class="batch-item-link">
            <input type="text" value="${link}" readonly id="batchLink${index}">
            <button onclick="copyBatchLink(${index})">Salin Link</button>
          </div>

          <div class="batch-item-text" id="batchText${index}">${text}</div>

          <div class="batch-item-actions">
            <button onclick="copyBatchText(${index})">
              Salin Teks WA
            </button>
          </div>

          <div class="batch-item-status" id="batchStatus${index}"></div>

        `;

        list.appendChild(item);

      });

    }


    function copyBatchLink(index) {

      const input =
        document.getElementById(
          "batchLink" + index
        );

      navigator.clipboard.writeText(
        input.value
      );

      document.getElementById(
        "batchStatus" + index
      ).textContent = "Link disalin!";

    }


    function copyBatchText(index) {

      const text =
        document.getElementById(
          "batchText" + index
        ).textContent;

      navigator.clipboard.writeText(
        text
      );

      document.getElementById(
        "batchStatus" + index
      ).textContent =
        "Teks WA disalin!";

    }


    /* ENTER KEY */

    document.getElementById(
      "guestName"
    ).addEventListener(
      "keypress",
      function(e) {

        if (e.key === "Enter") {

          generateSingle();

        }

      }
    );

  </script>

</body>
</html>
